<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokopia 攻略百科</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--card:#16213e;--accent:#e94560;--accent2:#0f3460;--text:#eee;--text2:#aaa;--gold:#f5c518;--border:#2a2a4a}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}
.header{background:linear-gradient(135deg,#0f3460,#e94560);padding:20px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.header h1{font-size:1.8em;margin-bottom:4px;text-shadow:2px 2px 4px rgba(0,0,0,.5)}
.header p{font-size:.9em;opacity:.85}
.nav{display:flex;justify-content:center;gap:4px;padding:12px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap}
.nav button{background:transparent;color:var(--text2);border:2px solid transparent;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:.9em;transition:all .2s}
.nav button:hover{color:var(--text);border-color:var(--accent)}
.nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-bar{padding:16px;background:var(--card);border-bottom:1px solid var(--border)}
.search-bar input{width:100%;padding:12px 16px;border-radius:24px;border:2px solid var(--border);background:var(--bg);color:var(--text);font-size:1em;outline:none;transition:border-color .2s}
.search-bar input:focus{border-color:var(--accent)}
.search-bar input::placeholder{color:var(--text2)}
.filters{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--border)}
.filter-chip{padding:6px 14px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:.8em;transition:all .2s}
.filter-chip:hover,.filter-chip.active{background:var(--accent2);color:var(--text);border-color:var(--accent2)}
.content{padding:16px;max-width:1200px;margin:0 auto}
.count{color:var(--text2);font-size:.85em;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border);cursor:pointer;transition:all .2s;display:flex;gap:12px;align-items:flex-start}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(233,69,96,.15)}
.card-sprite{width:64px;height:64px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));border-radius:8px;background:rgba(255,255,255,.05)}
.card-body{flex:1;min-width:0}
.card-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.card-id{font-size:.7em;color:var(--text2);background:var(--bg);padding:2px 6px;border-radius:6px}
.card-name{font-size:1.05em;font-weight:bold}
.card-name-en{font-size:.8em;color:var(--text2)}
.card-types{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.type-badge{font-size:.7em;padding:3px 8px;border-radius:10px;font-weight:bold;color:#fff}
.card-info{font-size:.78em;color:var(--text2);line-height:1.8}
.card-info span{color:var(--text)}
.type-Normal{background:#A8A878}.type-Fire{background:#F08030}.type-Water{background:#6890F0}
.type-Electric{background:#F8D030;color:#333}.type-Grass{background:#78C850}.type-Ice{background:#98D8D8;color:#333}
.type-Fighting{background:#C03028}.type-Poison{background:#A040A0}.type-Ground{background:#E0C068;color:#333}
.type-Flying{background:#A890F0}.type-Psychic{background:#F85888}.type-Bug{background:#A8B820;color:#333}
.type-Rock{background:#B8A038}.type-Ghost{background:#705898}.type-Dragon{background:#7038F8}
.type-Dark{background:#705848}.type-Steel{background:#B8B8D0;color:#333}.type-Fairy{background:#EE99AC;color:#333}
.habitat-card{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border);transition:all .2s;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.habitat-card:hover{border-color:var(--gold);box-shadow:0 4px 16px rgba(245,197,24,.1)}
.habitat-img{width:75px;height:75px;object-fit:cover;border-radius:8px;flex-shrink:0;background:rgba(255,255,255,.05)}
.habitat-body{flex:1;min-width:0}
.habitat-name{font-size:1em;font-weight:bold;margin-bottom:2px}
.habitat-name-en{font-size:.8em;color:var(--text2)}
.habitat-conditions{margin:8px 0;padding:8px 12px;background:var(--bg);border-radius:8px;font-size:.85em;line-height:1.6}
.habitat-conditions strong{color:var(--gold)}
.habitat-pokemon{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pm{font-size:.75em;background:var(--accent2);padding:3px 8px;border-radius:8px;color:var(--text);display:inline-flex;align-items:center;gap:3px}
.pm-img{width:20px;height:20px;vertical-align:middle}
.habitat-region{font-size:.7em;color:var(--gold);margin-top:6px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:16px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;border:2px solid var(--accent);position:relative}
.modal-close{position:absolute;top:12px;right:16px;font-size:1.5em;cursor:pointer;color:var(--text2);background:none;border:none}
.modal-close:hover{color:var(--accent)}
.modal h2{font-size:1.4em;margin-bottom:4px}
.modal .zh-name{color:var(--text2);font-size:1em;margin-bottom:12px}
.modal .detail-section{margin:12px 0;padding:10px;background:var(--bg);border-radius:8px}
.modal .detail-section h3{font-size:.85em;color:var(--accent);margin-bottom:6px}
.modal .detail-section p,.modal .detail-section li{font-size:.9em;line-height:1.6;color:var(--text2)}
.modal .detail-section li{list-style:none;padding:2px 0}
.modal-sprite{width:140px;height:140px;object-fit:contain;display:block;margin:0 auto 12px;filter:drop-shadow(0 4px 16px rgba(233,69,96,.3))}
.modal-habitat-img{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:12px}
.info-page{max-width:800px;margin:0 auto;padding:24px;line-height:1.8}
.info-page h2{color:var(--accent);margin:20px 0 8px;font-size:1.3em}
.info-page h3{color:var(--gold);margin:16px 0 6px}
.info-page ul{padding-left:20px}
.info-page li{margin:4px 0;color:var(--text2)}
.info-page p{color:var(--text2);margin:8px 0}
.info-page .tip{background:var(--accent2);padding:12px 16px;border-radius:8px;margin:12px 0;border-left:3px solid var(--gold)}
@media(max-width:600px){.header h1{font-size:1.3em}.grid{grid-template-columns:1fr}.nav button{padding:6px 12px;font-size:.8em}.card-sprite{width:48px;height:48px}}
</style>
</head>

<div class="header">
  <h1>🏝️ Pokopia 攻略百科</h1>
  <p>Pokémon Pokopia 宝可梦 · 栖息地 · 攻略指南</p>
</div>
<div class="nav" id="nav">
  <button class="active" data-tab="pokemon">📖 宝可梦图鉴</button>
  <button data-tab="habitats">🏕️ 栖息地</button>
  <button data-tab="guide">💡 攻略指南</button>
</div>
<div id="tab-pokemon" class="tab-content">
  <div class="search-bar"><input type="text" id="pokemon-search" placeholder="🔍 搜索宝可梦（中文名 / 英文名 / 属性 / 特长）..."></div>
  <div class="filters" id="type-filters"></div>
  <div class="content"><div class="count" id="pokemon-count"></div><div class="grid" id="pokemon-grid"></div></div>
</div>
<div id="tab-habitats" class="tab-content" style="display:none">
  <div class="search-bar"><input type="text" id="habitat-search" placeholder="🔍 搜索栖息地（名称 / 材料 / 宝可梦）..."></div>
  <div class="filters" id="region-filters"></div>
  <div class="content"><div class="count" id="habitat-count"></div><div class="grid" id="habitat-grid"></div></div>
</div>
<div id="tab-guide" class="tab-content" style="display:none">
  <div class="content info-page" id="guide-content"></div>
</div>
<div class="modal-overlay" id="modal">
  <div class="modal" id="modal-body">
    <button class="modal-close" id="modal-close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

// === Translation Maps ===
var TN={"Normal":"普通","Fire":"火","Water":"水","Electric":"电","Grass":"草","Ice":"冰","Fighting":"格斗","Poison":"毒","Ground":"地面","Flying":"飞行","Psychic":"超能","Bug":"虫","Rock":"岩石","Ghost":"幽灵","Dragon":"龙","Dark":"恶","Steel":"钢","Fairy":"妖精"};
var SN={"Build":"建造","Grow":"种植","Water":"浇水","Cut":"砍伐","Dig":"挖掘","Search":"搜索","Gather":"收集","Generate":"发电","Trade":"交易","Dream Island":"梦境岛","Eat":"进食","Litter":"乱丢","Gather Honey":"采蜜","Explode":"爆炸"};
var SI={"Build":"🔨","Grow":"🌱","Water":"💧","Cut":"✂️","Dig":"⛏️","Search":"🔍","Gather":"🧺","Generate":"⚡","Trade":"💰","Dream Island":"💤","Eat":"🍽️","Litter":"🗑️","Gather Honey":"🍯","Explode":"💥"};
var WN={"All":"全天候","Sun":"晴天","Rain":"雨天","Cloud":"多云"};
var WI={"All":"🌤️","Sun":"☀️","Rain":"🌧️","Cloud":"☁️"};
var TMN={"All day":"全天","Nighttime":"夜晚","Dawn":"黎明","Day":"白天","Dusk":"黄昏","Night":"夜晚"};
var TI={"All day":"☀️🌙","Nighttime":"🌙","Dawn":"🌅","Day":"☀️","Dusk":"🌇","Night":"🌙"};
var RN={"Withered Wasteland":"枯萎荒地","Bleak Beach":"萧瑟海滩","Rocky Ridges":"岩石山脊","Sparkling Skylands":"闪耀天空之地","Any":"通用"};
var CN={"Tall grass":"高草丛","Tall Grass (any)":"高草丛(任意)","Yellow tall grass":"黄色高草丛","Red tall grass":"红色高草丛","Pink tall grass":"粉色高草丛","Large Tree (any)":"大树(任意)","Large tree (any)":"大树(任意)","Large boulder":"大岩石","Large palm tree":"大棕榈树","Pointy tree":"尖树","Water":"水","Ocean Water":"海水","Ocean water":"海水","High-up location":"高处","Lighting (any)":"照明(任意)","Streetlight (any)":"路灯(任意)","Wildflowers":"野花","Seashore flowers":"海岸花","Mountain flowers":"山花","Skyland flowers":"天空花","Hedge (any)":"绿篱(任意)","Berry Tree (any)":"树果树(任意)","Vegetable field (any)":"菜地(任意)","Campfire":"篝火","Straw stool":"草凳","Straw table":"草桌","Seat (any)":"座位(任意)","Seat (wide)":"长椅","Table (any)":"桌子(任意)","Plated food":"盘装食物","Picnic basket":"野餐篮","Small vase":"小花瓶","Punching bag":"沙袋","First aid kit":"急救箱","Arrow sign":"箭头指示牌","Wooden path":"木路","Cart":"推车","Wooden crate":"木箱","Log chair":"原木椅","Log table":"原木桌","Tree stump (any)":"树桩(任意)","Bed (any)":"床(任意)","Doll (any)":"娃娃(任意)","Gravestone":"墓碑","Canoe":"独木舟","Duckweed":"浮萍","Molten rock":"熔岩石","Sandbags":"沙袋","Lava":"熔岩","Waterfall":"瀑布","Beach chair":"海滩椅"};
function tn(t){return TN[t]||t}
function sn(s){return SN[s]||s}
function si(s){return SI[s]||""}
function wn(w){return WN[w]||w}
function wi(w){return WI[w]||""}
function tmn(t){return TMN[t]||t}
function ti(t){return TI[t]||""}
function rn(r){return RN[r]||r}
function cn(s){var parts=s.split(", ");return parts.map(function(p){var m=p.match(/^(.+?)( x\d+)$/);var name=m?m[1].trim():p.trim();var qty=m?m[2]:"";return (CN[name]||name)+qty}).join(", ")}

// === State ===
var activeTab="pokemon",activeType=null,activeRegion=null;

// === Tabs ===
document.querySelectorAll(".nav button").forEach(function(b){b.addEventListener("click",function(){document.querySelectorAll(".nav button").forEach(function(x){x.classList.remove("active")});b.classList.add("active");activeTab=b.dataset.tab;document.querySelectorAll(".tab-content").forEach(function(t){t.style.display="none"});document.getElementById("tab-"+activeTab).style.display="block";if(activeTab==="guide")renderGuide()})});

// === Type Filters ===
var allTypes=[...new Set(pokemonData.flatMap(function(p){return p.types}))].sort();
var tf=document.getElementById("type-filters");
allTypes.forEach(function(t){var c=document.createElement("button");c.className="filter-chip";c.textContent=tn(t);c.addEventListener("click",function(){if(activeType===t){activeType=null;c.classList.remove("active")}else{document.querySelectorAll("#type-filters .filter-chip").forEach(function(x){x.classList.remove("active")});activeType=t;c.classList.add("active")}renderPokemon()});tf.appendChild(c)});

// === Region Filters ===
var allRegions=[...new Set(habitatData.map(function(h){return h.region}))].sort();
var rf=document.getElementById("region-filters");
allRegions.forEach(function(r){var c=document.createElement("button");c.className="filter-chip";c.textContent=rn(r);c.addEventListener("click",function(){if(activeRegion===r){activeRegion=null;c.classList.remove("active")}else{document.querySelectorAll("#region-filters .filter-chip").forEach(function(x){x.classList.remove("active")});activeRegion=r;c.classList.add("active")}renderHabitats()});rf.appendChild(c)});

// === Render Pokemon ===
function renderPokemon(){
  var q=document.getElementById("pokemon-search").value.toLowerCase();
  var g=document.getElementById("pokemon-grid");
  var f=pokemonData.filter(function(p){
    var ms=!q||p.name.toLowerCase().includes(q)||p.nameZh.includes(q)||p.types.some(function(t){return t.toLowerCase().includes(q)||tn(t).includes(q)})||p.specialty.some(function(s){return s.toLowerCase().includes(q)||sn(s).includes(q)})||p.habitats.some(function(h){return h.toLowerCase().includes(q)});
    var mt=!activeType||p.types.includes(activeType);
    return ms&&mt;
  });
  document.getElementById("pokemon-count").textContent="显示 "+f.length+" / "+pokemonData.length+" 只宝可梦";
  g.innerHTML=f.map(function(p){
    var spriteHtml=p.sprite?'<img class="card-sprite" src="'+p.sprite+'" alt="" loading="lazy">':"";
    var typesHtml=p.types.map(function(t){return '<span class="type-badge type-'+t+'">'+tn(t)+'</span>'}).join("");
    var specHtml=p.specialty.map(function(s){return si(s)+" "+sn(s)}).join(", ");
    return '<div class="card" onclick="showDetail('+p.id+')">'+spriteHtml+'<div class="card-body"><div class="card-header"><span class="card-id">#'+String(p.id).padStart(3,"0")+'</span><span class="card-name">'+p.nameZh+'</span><span class="card-name-en">'+p.name+'</span></div><div class="card-types">'+typesHtml+'</div><div class="card-info">特长: <span>'+specHtml+'</span><br>'+ti(p.time)+' '+tmn(p.time)+' · '+wi(p.weather)+' '+wn(p.weather)+'</div></div></div>';
  }).join("");
}

// === Render Habitats ===
function renderHabitats(){
  var q=document.getElementById("habitat-search").value.toLowerCase();
  var g=document.getElementById("habitat-grid");
  var pMap={};var sprMap={};
  pokemonData.forEach(function(p){pMap[p.name]=p.nameZh;if(p.spriteSmall)sprMap[p.name]=p.spriteSmall});
  var f=habitatData.filter(function(h){
    var ms=!q||h.name.toLowerCase().includes(q)||h.nameZh.includes(q)||h.conditions.toLowerCase().includes(q)||h.pokemon.some(function(p){return p.toLowerCase().includes(q)||(pMap[p]||"").includes(q)});
    var mr=!activeRegion||h.region===activeRegion;
    return ms&&mr;
  });
  document.getElementById("habitat-count").textContent="显示 "+f.length+" / "+habitatData.length+" 个栖息地";
  g.innerHTML=f.map(function(h){
    var pmHtml=h.pokemon.map(function(p){
      var img=sprMap[p]?'<img class="pm-img" src="'+sprMap[p]+'" loading="lazy">':"";
      return '<span class="pm">'+img+(pMap[p]||p)+'</span>';
    }).join("");
    return '<div class="habitat-card" onclick="showHabitatDetail('+h.id+')">'+(h.image?'<img class="habitat-img" src="'+h.image+'" alt="" loading="lazy">':'')+'<div class="habitat-body"><div class="habitat-name">#'+String(h.id).padStart(3,"0")+' '+h.nameZh+'</div><div class="habitat-name-en">'+h.name+'</div><div class="habitat-conditions"><strong>🔧 建造条件:</strong> '+cn(h.conditions)+'</div><div class="habitat-pokemon">'+pmHtml+'</div><div class="habitat-region">📍 '+rn(h.region)+'</div></div></div>';
  }).join("");
}

// === Detail Modal ===
function showDetail(id){
  var p=pokemonData.find(function(x){return x.id===id});
  if(!p)return;
  var spriteHtml=p.sprite?'<img class="modal-sprite" src="'+p.sprite+'" alt="'+p.nameZh+'">':"";
  var typesHtml=p.types.map(function(t){return '<span class="type-badge type-'+t+'">'+tn(t)+'</span>'}).join("");
  var specHtml=p.specialty.map(function(s){return si(s)+" "+sn(s)}).join(", ");
  // Build habitat list with Chinese names, images, and click-to-detail
  var hMap={};habitatData.forEach(function(h){h.pokemon.forEach(function(pm){if(!hMap[pm])hMap[pm]=[];hMap[pm].push(h)})});
  var matchedHabitats=hMap[p.name]||[];
  var habitatsHtml=matchedHabitats.length>0?matchedHabitats.map(function(h){
    var img=h.image?'<img style="width:40px;height:40px;object-fit:cover;border-radius:6px;flex-shrink:0" src="'+h.image+'" loading="lazy">':"";
    return '<div style="display:flex;align-items:center;gap:8px;background:var(--bg);padding:6px 10px;border-radius:8px;margin:4px 0;cursor:pointer" onclick="event.stopPropagation();document.getElementById(\'modal\').classList.remove(\'show\');setTimeout(function(){showHabitatDetail('+h.id+')},200)">'+img+'<div><div style="font-size:.85em;color:var(--text)">'+h.nameZh+'</div><div style="font-size:.7em;color:var(--text2)">#'+String(h.id).padStart(3,"0")+' '+h.name+'</div></div></div>';
  }).join(""):'<p style="color:var(--text2)">'+p.habitats.join(", ")+'</p>';
  document.getElementById("modal-content").innerHTML=spriteHtml+'<h2>'+p.nameZh+' <span style="color:var(--text2);font-size:.7em">#'+String(p.id).padStart(3,"0")+'</span></h2><div class="zh-name">'+p.name+' · 第'+p.gen+'世代</div><div style="display:flex;gap:4px;margin:8px 0">'+typesHtml+'</div><div class="detail-section"><h3>⚡ 特长</h3><p>'+specHtml+'</p></div><div class="detail-section"><h3>🏕️ 栖息地</h3>'+habitatsHtml+'</div><div class="detail-section"><h3>⏰ 出现条件</h3><p>'+ti(p.time)+' 时间: '+tmn(p.time)+'<br>'+wi(p.weather)+' 天气: '+wn(p.weather)+'</p></div>';
  document.getElementById("modal").classList.add("show");
}

// === Habitat Detail Modal ===
function showHabitatDetail(id){
  var h=habitatData.find(function(x){return x.id===id});
  if(!h)return;
  var pMap={};var sprMap={};
  pokemonData.forEach(function(p){pMap[p.name]=p.nameZh;if(p.sprite)sprMap[p.name]=p.sprite;});
  var imgHtml=h.image?'<img class="modal-habitat-img" src="'+h.image+'" alt="'+h.nameZh+'">':"";
  var pmHtml=h.pokemon.map(function(p){
    var spr=sprMap[p]?'<img style="width:40px;height:40px;object-fit:contain;vertical-align:middle" src="'+sprMap[p]+'" loading="lazy">':"";
    return '<div style="display:inline-flex;align-items:center;gap:6px;background:var(--bg);padding:4px 10px;border-radius:8px;margin:3px;cursor:pointer" onclick="event.stopPropagation();findPokemonByName(\''+p.replace(/'/g,"\\'")+'\')">' + spr + '<span style="font-size:.85em">'+(pMap[p]||p)+'</span></div>';
  }).join("");
  var condHtml=cn(h.conditions).split(", ").map(function(c){return "<li>"+c+"</li>"}).join("");
  document.getElementById("modal-content").innerHTML=imgHtml+'<h2>'+h.nameZh+' <span style="color:var(--text2);font-size:.7em">#'+String(h.id).padStart(3,"0")+'</span></h2><div class="zh-name">'+h.name+'</div><div class="detail-section"><h3>🔧 建造条件</h3><ul style="list-style:none;padding:0">'+condHtml+'</ul></div><div class="detail-section"><h3>🐾 可吸引的宝可梦</h3><div style="display:flex;flex-wrap:wrap;gap:4px">'+pmHtml+'</div></div><div class="detail-section"><h3>📍 区域</h3><p>'+rn(h.region)+'</p></div>';
  document.getElementById("modal").classList.add("show");
}

// === Find Pokemon by name (from habitat detail) ===
function findPokemonByName(name){
  var p=pokemonData.find(function(x){return x.name===name});
  if(p){document.getElementById("modal").classList.remove("show");setTimeout(function(){showDetail(p.id)},200);}
}

// === Guide ===
function renderGuide(){
  document.getElementById("guide-content").innerHTML='<h2>🎮 Pokémon Pokopia 新手攻略</h2><p>在 Pokopia 中，你扮演一只变身为人类的百变怪（Ditto），通过建造栖息地来吸引宝可梦，逐步恢复这个末日后的世界。</p><h2>📋 核心机制</h2><h3>栖息地系统</h3><ul><li>将特定物品放在一起会形成栖息地</li><li>不同栖息地吸引不同的宝可梦</li><li>地面上的闪光点可以发现宝可梦的痕迹，获得栖息地提示</li><li>宝可梦中心终端可以购买栖息地提示</li></ul><h3>时间与天气</h3><ul><li>游戏的昼夜周期与 Switch 2 系统时间同步</li><li>部分宝可梦只在特定时间和天气出现</li></ul><h3>宝可梦不会进化！</h3><div class="tip"><strong>⚠️ 重要：</strong>Pokopia 中没有进化系统。每种宝可梦只能遇到一只并成为朋友。</div><h3>宝可梦特长</h3><ul><li>🔨 <strong>建造</strong> - 帮助建造设施</li><li>🌱 <strong>种植</strong> - 种植花草</li><li>💧 <strong>浇水</strong> - 浇水</li><li>✂️ <strong>砍伐</strong> - 砍伐</li><li>⛏️ <strong>挖掘</strong> - 挖掘</li><li>🔍 <strong>搜索</strong> - 搜索物品</li><li>🧺 <strong>收集</strong> - 收集材料</li><li>⚡ <strong>发电</strong> - 发电</li><li>💰 <strong>交易</strong> - 交易</li></ul><h2>🗺️ 四大区域</h2><h3>Withered Wasteland（枯萎荒地）</h3><p>起始区域。绿色草丛 + 粉色野花。御三家都在这里。</p><h3>Bleak Beach（萧瑟海滩）</h3><p>黄色草丛 + 海岸花卉。水系和飞行系宝可梦的家园。</p><h3>Rocky Ridges（岩石山脊）</h3><p>红色草丛 + 山花。格斗系、岩石系宝可梦的家园。</p><h3>Sparkling Skylands（闪耀天空之地）</h3><p>粉色草丛 + 天空花卉。龙系和稀有宝可梦出没。</p><h2>🔗 有用链接</h2><ul><li><a href="https://pokemon-pokopia.fandom.com/" target="_blank">Pokopia Wiki (Fandom)</a></li><li><a href="https://game8.co/games/Pokemon-Pokopia" target="_blank">Game8 攻略站</a></li><li><a href="https://www.serebii.net/pokemonpokopia/" target="_blank">Serebii.net</a></li></ul><p style="margin-top:24px;color:var(--text2);font-size:.85em;text-align:center">数据持续更新中 · 共收录 '+pokemonData.length+' 只宝可梦 / '+habitatData.length+' 个栖息地<br>最后更新: 2026-03-11</p>';
}
